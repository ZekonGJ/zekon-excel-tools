name: Build complete ZekonSetup
on:
  push:
    branches: [main, installer-local-folder]
    paths: ["installer/**", "installer.Tests/**", "updates/**", "tools/verify_update_feed.py", ".github/workflows/build-installer.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: python -m unittest discover -s tests -v
      - run: dotnet run --project installer.Tests/Installer.Tests.csproj --configuration Release
      - run: python tools/verify_update_feed.py --export-dir dist
      - run: dotnet publish installer/ZekonSetup.csproj --configuration Release --output dist
      - name: Installer checksum
        run: '(Get-FileHash dist/ZekonSetup.exe -Algorithm SHA256).Hash + "  ZekonSetup.exe" | Set-Content dist/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ZekonSetup-review
          path: |
            dist/ZekonSetup.exe
            dist/SHA256.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Zekon-addon-update
          path: dist/*.zekonupdate
          if-no-files-found: error

