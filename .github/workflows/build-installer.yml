name: Build complete ZekonSetup
on:
  push:
    branches: [main]
    paths: ["release-input/**", ".github/workflows/build-installer.yml"]
  workflow_dispatch:
    inputs:
      version:
        description: 'Must match the tested XLAM and APP_VERSION'
        default: '1.0.0-rc2'
        required: true
      release_number:
        description: 'Increasing positive integer, never reuse for different content'
        default: '2'
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: dotnet run --project installer.Tests/Installer.Tests.csproj --configuration Release
      - name: Require tested XLAM and prepare embedded payload
        env:
          RELEASE_VERSION: ${{ inputs.version || '1.0.0-rc2' }}
          RELEASE_NUMBER: ${{ inputs.release_number || '2' }}
        run: python tools/package_release.py --version "$env:RELEASE_VERSION" --release-number "$env:RELEASE_NUMBER"
      - run: dotnet publish installer/ZekonSetup.csproj --configuration Release --output dist
      - name: Installer checksum
        run: '(Get-FileHash dist/ZekonSetup.exe -Algorithm SHA256).Hash + "  ZekonSetup.exe" | Set-Content dist/SHA256.txt'
      - uses: actions/upload-artifact@v4
        with:
          name: ZekonSetup-review
          path: |
            dist/ZekonSetup.exe
            dist/SHA256.txt
          if-no-files-found: error
      # No automatic public release: native Windows/Excel install tests and signing first.
